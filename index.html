<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">  <script src="https://cdn.tailwindcss.com"></script>

    .scrollbar-thin::-webkit-scrollbar-track { background: #f1f1f1; }

    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-graduation-cap text-2xl text-amber-400"></i>
        <div>
          <h1 class="text-xl font-bold tracking-wide">阿摩學士後中西醫歷屆試題總整理</h1>
          <p class="text-xs text-indigo-200">中國醫・義守・慈濟・高醫・中山・清大 歷年試題快捷索引</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="openYearModal()" class="bg-indigo-800 hover:bg-indigo-700 text-xs px-3 py-1.5 rounded border border-indigo-600 transition flex items-center gap-1.5">
          <i class="fa-solid fa-calendar-days text-amber-300"></i> 年度設定 (<span id="maxYearDisplay">115</span>)
        </button>
        <button onclick="openBatchModal()" class="bg-indigo-800 hover:bg-indigo-700 text-xs px-3 py-1.5 rounded border border-indigo-600 transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-import text-amber-300"></i> 批量匯入/匯出網址
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col md:flex-row gap-6">

    <!-- Left Sidebar: Subjects -->
    <aside class="w-full md:w-64 bg-white rounded-xl shadow-sm border border-slate-200 p-4 shrink-0 h-fit">
      <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3 flex items-center justify-between">
        <span><i class="fa-solid fa-book-open text-indigo-600 mr-2"></i>選擇考試科目</span>
      </h2>
      <nav id="subjectList" class="space-y-1">
        <!-- JS Dynamic Generation -->
      </nav>

      <div class="mt-6 p-3 bg-indigo-50 border border-indigo-100 rounded-lg text-xs text-indigo-800 space-y-2">
        <div class="font-semibold flex items-center gap-1">
          <i class="fa-solid fa-circle-info text-indigo-600"></i> 圖示說明
        </div>
        <div class="flex items-center gap-2 text-emerald-700">
          <i class="fa-solid fa-circle-check"></i>
          <span><b>綠色勾勾</b>：直達試題專頁 (exam)</span>
        </div>
        <div class="flex items-center gap-2 text-sky-700">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span><b>藍色搜尋</b>：阿摩精準搜尋</span>
        </div>
        <div class="flex items-center gap-2 text-slate-400">
          <i class="fa-solid fa-ban"></i>
          <span><b>灰色區塊</b>：未招生 / 無此科目</span>
        </div>
        <p class="text-[11px] text-slate-500 pt-1 border-t border-indigo-100">
          💡 提示：在試題按鈕上按<b>右鍵</b>可快捷設定/修改該年阿摩網址。
        </p>
      </div>
    </aside>

    <!-- Right Main Table -->
    <main class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col min-w-0">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-3 mb-3 border-b border-slate-100 gap-2">
        <div>
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <span id="currentSubjectTitle" class="text-indigo-600">英文</span>
            <span class="text-xs font-normal text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full" id="subjectSubtitle">後中醫 / 後西醫歷屆試題</span>
          </h2>
        </div>
        <div class="flex items-center gap-2">
          <div class="relative">
            <input type="text" id="yearSearchInput" placeholder="搜尋年份 (如 114)..." oninput="filterYears()" class="w-36 text-xs bg-slate-50 border border-slate-300 rounded-lg pl-7 pr-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-slate-400 text-xs"></i>
          </div>
        </div>
      </div>

          <thead class="text-xs text-slate-700 uppercase bg-slate-100 sticky top-0 z-20 shadow-sm">
            <tr>
              <th scope="col" class="px-3 py-3 w-20 text-center border-b border-r border-slate-200 bg-slate-100">學年度</th>
              <th scope="col" class="px-3 py-3 text-center border-b border-r border-slate-200">中國醫</th>
              <th scope="col" class="px-3 py-3 text-center border-b border-r border-slate-200">義守</th>
              <th scope="col" class="px-3 py-3 text-center border-b border-r border-slate-200">慈濟</th>
              <th scope="col" class="px-3 py-3 text-center border-b border-r border-slate-200">高醫</th>
              <th scope="col" class="px-3 py-3 text-center border-b border-r border-slate-200">中山</th>
              <th scope="col" class="px-3 py-3 text-center border-b border-slate-200">清大</th>
            </tr>
          </thead>
          <tbody id="examTableBody" class="divide-y divide-slate-200">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modals -->
  <div id="editUrlModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">

      <div class="flex justify-between items-center border-b pb-2">

        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">阿摩線上測驗網址 (exam-xxxx.htm 或 search)</label>
        <input type="url" id="modalUrlInput" placeholder="https://yamol.tw/exam-..." class="w-full text-xs p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        <p class="text-[11px] text-slate-400 mt-1">留空將恢復預設的精準關鍵字搜尋。</p>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeEditModal()" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
        <button onclick="saveSingleUrl()" class="px-4 py-1.5 text-xs bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">儲存設定</button>
      </div>
    </div>
  </div>

  <div id="yearModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">

        <button onclick="closeYearModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">最高學年度 (例如明年考完可設為 116)</label>
        <input type="number" id="maxYearInput" value="115" min="100" max="130" class="w-full text-sm p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeYearModal()" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
        <button onclick="saveMaxYear()" class="px-4 py-1.5 text-xs bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">套用並更新表格</button>
      </div>
    </div>
  </div>

  <div id="batchModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-5 space-y-4">

        <button onclick="closeBatchModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div>
        <textarea id="batchJsonTextarea" rows="10" class="w-full text-xs font-mono p-2.5 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none scrollbar-thin" placeholder='{"English_cmu_115": "https://yamol.tw/..."}'></textarea>
      </div>
      <div class="flex justify-between items-center pt-2">
        <button onclick="resetToDefault()" class="text-xs text-rose-600 hover:underline">重置為預設網址</button>
        <div class="flex gap-2">
          <button onclick="closeBatchModal()" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
          <button onclick="saveBatchJson()" class="px-4 py-1.5 text-xs bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">儲存並覆蓋</button>
        </div>
      </div>
    </div>
  </div>

    let activeSubjectId = 'English';
    let maxYear = 115;
    let urlMappings = {};
    let activeEditingKey = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderSubjectList();
      renderTable();
    });

    function loadState() {
      const savedMaxYear = localStorage.getItem('yamol_max_year');
      if (savedMaxYear) maxYear = parseInt(savedMaxYear, 10);
      document.getElementById('maxYearDisplay').textContent = maxYear;
      document.getElementById('maxYearInput').value = maxYear;

      const savedMappings = localStorage.getItem('yamol_url_mappings');
      if (savedMappings) {
        try {
          urlMappings = JSON.parse(savedMappings);
        } catch(e) {
          urlMappings = { ...DEFAULT_URL_MAPPINGS };
        }
      } else {
        urlMappings = { ...DEFAULT_URL_MAPPINGS };
      }

      // 自動整合最新程式碼內建的 DEFAULT_URL_MAPPINGS
      Object.assign(urlMappings, DEFAULT_URL_MAPPINGS);
    }

    function saveState() {
      localStorage.setItem('yamol_max_year', maxYear);
      localStorage.setItem('yamol_url_mappings', JSON.stringify(urlMappings));
    }

    function renderSubjectList() {
      const container = document.getElementById('subjectList');
      container.innerHTML = SUBJECTS.map(subj => {
        const isActive = subj.id === activeSubjectId;
        return `
          <button onclick="switchSubject('${subj.id}')"
            class="w-full text-left px-3.5 py-2.5 rounded-lg transition text-sm flex items-center justify-between ${
              isActive 
                ? 'bg-indigo-600 text-white font-medium shadow-sm' 
                : 'text-slate-700 hover:bg-slate-100 hover:text-slate-900'
            }">
            <span>${subj.name}</span>
            <i class="fa-solid fa-chevron-right text-xs ${isActive ? 'text-indigo-200' : 'text-slate-300'}"></i>
          </button>
        `;
      }).join('');
    }

    function switchSubject(id) {
      activeSubjectId = id;
      const subj = SUBJECTS.find(s => s.id === id);
      document.getElementById('currentSubjectTitle').textContent = subj.name;
      document.getElementById('subjectSubtitle').textContent = subj.subtitle;
      renderSubjectList();
      renderTable();
    }

    function isExamApplicable(school, subjectId, year) {
      if (year < school.startYear) {
        return { valid: false, reason: '未開考' };
      }

      if (subjectId === 'Chinese') {
        if (school.type === 'WEST') return { valid: false, reason: '無此科' };
      }
      if (subjectId === 'TCM') {
        if (school.type === 'WEST' || school.id === 'kmu') return { valid: false, reason: '無此科' };
      }
      if (subjectId === 'Physics') {
        if (school.type === 'TCM') return { valid: false, reason: '無此科' };
      }

      return { valid: true };
    }

    function generateSearchUrl(school, year, subjectName) {
      let deptName = '學士後中醫';
      if (school.type === 'WEST' || school.id === 'kmu') deptName = '學士後醫學系';

      const keyword = `${year}年 ${school.fullName} ${deptName} ${subjectName}`;
      return `https://yamol.tw/search.php?q=${encodeURIComponent(keyword)}`;
    }

    function renderTable() {
      const tbody = document.getElementById('examTableBody');
      const subject = SUBJECTS.find(s => s.id === activeSubjectId);
      const searchTerm = document.getElementById('yearSearchInput').value.trim();

      let html = '';
      for (let year = maxYear; year >= 90; year--) {
        if (searchTerm && !year.toString().includes(searchTerm)) continue;

        html += `
          <tr class="hover:bg-slate-50/80 transition text-center">
            <td class="px-3 py-2.5 font-bold text-slate-600 bg-slate-50 border-r border-b border-slate-200">${year} 年</td>
        `;

        SCHOOLS.forEach(school => {
          const app = isExamApplicable(school, activeSubjectId, year);
          const mappingKey = `${activeSubjectId}_${school.id}_${year}`;
          const customUrl = urlMappings[mappingKey];

          if (!app.valid) {
            html += `
              <td class="px-2 py-2 border-r border-b border-slate-200 bg-slate-50/40">
                <span class="text-xs text-slate-300 select-none">${app.reason}</span>
              </td>
            `;
          } else {
            let targetUrl = customUrl;
            let isVerified = false;

            if (customUrl && customUrl.includes('exam-')) {
              isVerified = true;
            } else if (!targetUrl) {
              targetUrl = generateSearchUrl(school, year, subject.name);
            }

            const badgeClass = isVerified
              ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100 hover:border-emerald-300'
              : 'bg-sky-50 text-sky-700 border-sky-200 hover:bg-sky-100 hover:border-sky-300';

            const iconClass = isVerified
              ? 'fa-solid fa-circle-check text-emerald-600'
              : 'fa-solid fa-magnifying-glass text-sky-500';

            const btnText = `${year} ${school.name}`;

            html += `
              <td class="px-2 py-2 border-r border-b border-slate-200">
                <a href="${targetUrl}" target="_blank" rel="noopener noreferrer"
                  oncontextmenu="openContextMenu(event, '${mappingKey}', '${year} 年 ${school.name} ${subject.name}')"
                  title="點擊前往：${isVerified ? '阿摩試題專頁' : '阿摩精準搜尋'} (右鍵可修改連結)"
                  class="inline-flex items-center justify-center gap-1.5 w-full py-1.5 px-2 text-xs font-medium border rounded-md transition shadow-2xs ${badgeClass}">
                  <i class="${iconClass} text-[11px]"></i>
                  <span>${btnText}</span>
                </a>
              </td>
            `;
          }
        });

        html += `</tr>`;
      }

      tbody.innerHTML = html;
    }

    function filterYears() {
      renderTable();
    }

    function openContextMenu(e, key, title) {
      e.preventDefault();
      activeEditingKey = key;
      document.getElementById('editModalTitle').textContent = `修改連結：${title}`;
      document.getElementById('modalUrlInput').value = urlMappings[key] || '';
      document.getElementById('editUrlModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editUrlModal').classList.add('hidden');
      activeEditingKey = null;
    }

    function saveSingleUrl() {
      if (!activeEditingKey) return;
      const url = document.getElementById('modalUrlInput').value.trim();
      if (url) {
        urlMappings[activeEditingKey] = url;
      } else {
        delete urlMappings[activeEditingKey];
      }
      saveState();
      closeEditModal();
      renderTable();
    }

    function openYearModal() {
      document.getElementById('yearModal').classList.remove('hidden');
    }

    function closeYearModal() {
      document.getElementById('yearModal').classList.add('hidden');
    }

    function saveMaxYear() {
      const val = parseInt(document.getElementById('maxYearInput').value, 10);
      if (val && val >= 100 && val <= 130) {
        maxYear = val;
        document.getElementById('maxYearDisplay').textContent = maxYear;
        saveState();
        closeYearModal();
        renderTable();
      }
    }

    function openBatchModal() {
      document.getElementById('batchJsonTextarea').value = JSON.stringify(urlMappings, null, 2);
      document.getElementById('batchModal').classList.remove('hidden');
    }

    function closeBatchModal() {
      document.getElementById('batchModal').classList.add('hidden');
    }

    function saveBatchJson() {
      try {
        const text = document.getElementById('batchJsonTextarea').value.trim();
        urlMappings = text ? JSON.parse(text) : {};
        saveState();
        closeBatchModal();
        renderTable();
      } catch(err) {
        alert('JSON 格式錯誤，請檢查後再試！');
      }
    }

    function resetToDefault() {
      if (confirm('確定要將所有網址恢復為系統預設值嗎？')) {
        urlMappings = { ...DEFAULT_URL_MAPPINGS };
        saveState();
        closeBatchModal();
        renderTable();
      }
    }
  </script>
</body>
</html>
